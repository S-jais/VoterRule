    <!-- Pre-paint: establish theme / motion / lite mode before initial render -->
    <script>
      (function () {
        var r = document.documentElement;
        var theme = null;
        try { theme = localStorage.getItem('voterrule_theme') || localStorage.getItem('voterrule_theme'); } catch(e) {}
        if (!theme) {
          var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          theme = dark ? 'dark' : 'light';
        }
        r.setAttribute('data-theme', theme);

        var lite = false;
        try {
          lite = (localStorage.getItem('voterrule_lite_mode') || localStorage.getItem('voterrule_lite_mode')) === 'true';
        } catch (e) {}
        var sd = navigator.connection && navigator.connection.saveData;
        var rm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (sd) lite = true;
        r.classList.toggle('lite', lite);
        if (!rm && !lite) {
          r.classList.add('motion');
        }
      })();
    </script>
